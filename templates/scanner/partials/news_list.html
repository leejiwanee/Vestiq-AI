{% load i18n %}

{% if news_items %}
<div class="list-group list-group-flush">
    {% for news in news_items %}
    <a href="{{ news.url }}" target="_blank" class="list-group-item list-group-item-action px-0 py-3">
        <div class="d-flex w-100 justify-content-between">
            <h6 class="mb-1 text-dark fw-semibold">{{ news.title }}</h6>
            <small class="text-muted ms-2 text-nowrap">{{ news.published_date }}</small>
        </div>
        <small class="text-primary">Read more <i class="bi bi-box-arrow-up-right ms-1" style="font-size: 0.7rem;"></i></small>
    </a>
    {% endfor %}
</div>
{% else %}
<div class="text-center py-4 text-muted">
    <i class="bi bi-newspaper display-6 mb-2"></i>
    <p>{% trans "No recent news found." %}</p>
</div>
{% endif %}
