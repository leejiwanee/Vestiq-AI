<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3E5AB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#999999;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- "Expert" Monogram: A stylized Star / Compass formed by interlocking V shapes -->
  
  <!-- Central Diamond / Star vertical -->
  <path d="M50 10 L60 40 L90 50 L60 60 L50 90 L40 60 L10 50 L40 40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1" />
  
  <!-- Inner Detail: Interlocking angular lines representing precision -->
  <path d="M50 25 L58 50 L50 75 L42 50 Z" fill="none" stroke="url(#silverGrad)" stroke-width="0.8" opacity="0.9" />
  
  <!-- Outer Orbit lines for elegance -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-dasharray="1 3" opacity="0.6" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="#E5E4E2" stroke-width="0.3" opacity="0.4" />

  <!-- Accent Points -->
  <circle cx="50" cy="10" r="1.5" fill="#fff" />
  <circle cx="50" cy="90" r="1.5" fill="#fff" />
</svg>
